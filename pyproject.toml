[project]
name = "policy-data"
version = "0.1.0"
description = "Open Italian parliamentary roll-call data for people and agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28.1,<0.29",
  "jinja2>=3.1.6,<4",
  "mcp==2.0.0",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.22,<0.1",
  "rdflib>=7.1,<8",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["policy_data"]
mypy_path = "src"
