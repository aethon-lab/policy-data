<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Policy Data Italia{% endblock %}</title>
  <meta name="description" content="Voti parlamentari italiani, verificabili alla fonte. Camera e Senato in un unico archivio aperto.">
  <meta property="og:title" content="Policy Data Italia — Segui i voti, non gli slogan.">
  <meta property="og:description" content="Camera e Senato, fonti ufficiali, un archivio aperto per persone e agenti.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ public_site_url }}/static/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ public_site_url }}/static/og.png">
  <link rel="stylesheet" href="{{ url_for('static', path='/site.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">PD</span><span>Policy Data <i>Italia</i></span></a>
    <nav aria-label="Navigazione principale">
      <a href="/politici">Politici</a><a href="/votazioni">Votazioni</a><a href="/dati">Dati</a><a href="/docs">API</a><a class="nav-cta" href="/dashboard">API key</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <p><strong>Policy Data Italia</strong> — dati ufficiali, codice aperto, interpretazioni separate dai fatti.</p>
    <p><a href="/privacy">Privacy</a> · <a href="/llms.txt">llms.txt</a> · codice sorgente in pubblicazione</p>
  </footer>
</body>
</html>
