name: policy-data

x-security: &security
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.5
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  serve:
    <<: *security
    image: ${POLICY_DATA_IMAGE:-policy-data:local}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      POLICY_DATA_ENV: production
      POLICY_DATA_DATA_DIR: /var/lib/policy-data
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS},127.0.0.1,localhost
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      CURSOR_SECRET_FILE: /run/secrets/cursor_secret
      AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_SENDER: ${RESEND_SENDER:?set RESEND_SENDER}
    expose:
      - "8000"
    volumes:
      - control:/var/lib/policy-data
      - ${POLICY_DATA_RELEASES_DIR:-./state/published}:/var/lib/policy-data/published:ro
    secrets:
      - cursor_secret
      - auth_pepper
      - resend_api_key
    networks:
      - backend
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  refresh:
    <<: *security
    profiles: [refresh]
    restart: "no"
    image: ${POLICY_DATA_IMAGE:-policy-data:local}
    command: [python, -m, policy_data.refresh]
    environment:
      POLICY_DATA_ENV: refresh
      POLICY_DATA_DATA_DIR: /var/lib/policy-data
    volumes:
      - ../config:/app/config:ro
      - ${POLICY_DATA_RAW_DIR:-./state/raw}:/var/lib/policy-data/raw:rw
      - ${POLICY_DATA_STAGING_DIR:-./state/staging}:/var/lib/policy-data/staging:rw
      - ${POLICY_DATA_RELEASES_DIR:-./state/published}:/var/lib/policy-data/published:rw
    networks:
      - source-egress

volumes:
  control:

secrets:
  cursor_secret:
    file: ${CURSOR_SECRET_FILE:?set CURSOR_SECRET_FILE}
  auth_pepper:
    file: ${AUTH_PEPPER_FILE:?set AUTH_PEPPER_FILE}
  resend_api_key:
    file: ${RESEND_API_KEY_FILE:?set RESEND_API_KEY_FILE}

networks:
  backend:
    internal: true
  source-egress:
